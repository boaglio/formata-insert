<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
      background-color: #181818;
      color: white;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    #title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    textarea {
      width: 800px;
      height: 150px;
      margin: 10px;
      padding: 10px;
      resize: none;
      background-color: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      font-family: 'Consolas', 'Menlo', monospace;
    }

    #buttonRow {
      display: flex;
      gap: 10px;
    }

    #formatRow {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 10px 0 20px;
      font-size: 14px;
    }

    #formatRow label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button.secondary {
      background-color: #555;
    }

    button:disabled {
      background-color: #3a3a3a;
      color: #888;
      cursor: not-allowed;
    }

    #resultTextarea {
      margin-top: 20px;
      width: 800px;
      height: 500px;
      padding: 10px;
      resize: none;
      background-color: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      font-family: 'Consolas', 'Menlo', monospace;
    }

    #resultTextarea.hasError {
      border-color: #d9534f;
    }

    #link {
      margin-top: 20px;
      text-decoration: none;
      color: #4CAF50;
    }

    .github-fork-ribbon {
      position: fixed;
      top: 0;
      right: 0;
      width: 200px;
      height: 200px;
      overflow: hidden;
      z-index: 1000;
      pointer-events: none;
    }

    .github-fork-ribbon span {
      position: absolute;
      top: 42px;
      right: -58px;
      width: 260px;
      padding: 8px 0;
      background-color: #4CAF50;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      color: white;
      font: 700 14px 'Arial', sans-serif;
      text-align: center;
      text-decoration: none;
      transform: rotate(45deg);
      pointer-events: auto;
    }
  </style>
  <title>Formata INSERT</title>
</head>
<body>
  <a href="https://github.com/boaglio/formata-insert" class="github-fork-ribbon" target="_blank" rel="noopener" aria-label="Fork me on GitHub">
    <span>Fork me on GitHub</span>
  </a>
  <div id="container">
    <div id="title">Formata INSERT</div>
    <textarea id="sqlInput" placeholder="Insira um ou mais SQL INSERT aqui (aceita múltiplas linhas, múltiplos INSERTs e múltiplas linhas de VALUES)"></textarea>
    <div id="formatRow">
      <span>Formato:</span>
      <label><input type="radio" name="outputFormat" value="sql" checked> SQL formatado</label>
      <label><input type="radio" name="outputFormat" value="columnValue"> Coluna: valor</label>
    </div>
    <div id="buttonRow">
      <button onclick="formatarSQL()">Formatar SQL</button>
      <button id="copyButton" class="secondary" onclick="copiarResultado()">Copiar resultado</button>
      <button class="secondary" onclick="carregarExemplo()">Carregar exemplo</button>
      <button class="secondary" onclick="limpar()">Limpar</button>
    </div>
    <textarea id="resultTextarea" placeholder="SQL formatado aparecerá aqui" readonly></textarea>
    <a href="https://github.com/boaglio/formata-insert" id="link" target="_blank">https://github.com/boaglio/formata-insert</a>
  </div>

  <script>
    // --- Tokenization helpers -------------------------------------------------
    // Skip over a quoted string/identifier (', ", `) starting at index i,
    // honoring backslash escapes and doubled-quote escapes ('' or ``).
    // Returns the index of the closing quote.
    function skipQuoted(str, i, quoteChar) {
      let j = i + 1;
      while (j < str.length) {
        if (str[j] === '\\') { j += 2; continue; }
        if (str[j] === quoteChar) {
          if (str[j + 1] === quoteChar) { j += 2; continue; }
          return j;
        }
        j++;
      }
      return str.length - 1;
    }

    // Find the index of the ')' that matches the '(' at openIndex,
    // ignoring parens that appear inside quoted strings.
    function findMatchingParen(str, openIndex) {
      let depth = 0;
      let i = openIndex;
      while (i < str.length) {
        const ch = str[i];
        if (ch === "'" || ch === '"' || ch === '`') {
          i = skipQuoted(str, i, ch) + 1;
          continue;
        }
        if (ch === '(') { depth++; i++; continue; }
        if (ch === ')') { depth--; if (depth === 0) return i; i++; continue; }
        i++;
      }
      return -1;
    }

    // Split str by `separator`, ignoring separators inside quoted strings
    // or inside nested parentheses (e.g. NOW(), CONCAT(a,b), subqueries).
    function splitTopLevel(str, separator) {
      const result = [];
      let depth = 0;
      let current = '';
      let i = 0;
      while (i < str.length) {
        const ch = str[i];
        if (ch === "'" || ch === '"' || ch === '`') {
          const end = skipQuoted(str, i, ch);
          current += str.slice(i, end + 1);
          i = end + 1;
          continue;
        }
        if (ch === '(') { depth++; current += ch; i++; continue; }
        if (ch === ')') { depth--; current += ch; i++; continue; }
        if (ch === separator && depth === 0) {
          result.push(current.trim());
          current = '';
          i++;
          continue;
        }
        current += ch;
        i++;
      }
      if (current.trim() !== '') result.push(current.trim());
      return result;
    }

    function splitStatements(sql) {
      return splitTopLevel(sql, ';').filter(s => s.trim() !== '');
    }

    // --- Parsing ---------------------------------------------------------------
    // Parses a single "INSERT INTO table (cols) VALUES (...), (...), ..." statement.
    // Supports an optional column list and multiple value tuples (multi-row insert).
    function parseInsertStatement(stmt) {
      const insertIntoMatch = stmt.match(/^\s*INSERT\s+INTO\s+/i);
      if (!insertIntoMatch) {
        return { error: 'não encontrei "INSERT INTO"' };
      }
      let idx = insertIntoMatch[0].length;

      const tableMatch = stmt.slice(idx).match(/^([`"[]?[\w.]+[`"\]]?)/);
      if (!tableMatch || tableMatch[1] === '') {
        return { error: 'não encontrei o nome da tabela' };
      }
      const tableName = tableMatch[1];
      idx += tableMatch[0].length;

      while (idx < stmt.length && /\s/.test(stmt[idx])) idx++;

      let columns = null;
      if (stmt[idx] === '(') {
        const closeIdx = findMatchingParen(stmt, idx);
        if (closeIdx === -1) {
          return { error: 'parênteses da lista de colunas não fecham' };
        }
        columns = splitTopLevel(stmt.slice(idx + 1, closeIdx), ',');
        idx = closeIdx + 1;
      }

      while (idx < stmt.length && /\s/.test(stmt[idx])) idx++;

      const valuesMatch = stmt.slice(idx).match(/^VALUES\s*/i);
      if (!valuesMatch) {
        return { error: 'não encontrei "VALUES"' };
      }
      idx += valuesMatch[0].length;

      const rows = [];
      while (true) {
        while (idx < stmt.length && /\s/.test(stmt[idx])) idx++;
        if (stmt[idx] !== '(') break;
        const closeIdx = findMatchingParen(stmt, idx);
        if (closeIdx === -1) {
          return { error: 'parênteses de valores não fecham' };
        }
        rows.push(splitTopLevel(stmt.slice(idx + 1, closeIdx), ','));
        idx = closeIdx + 1;
        while (idx < stmt.length && /\s/.test(stmt[idx])) idx++;
        if (stmt[idx] === ',') { idx++; continue; }
        break;
      }

      if (rows.length === 0) {
        return { error: 'não encontrei valores em VALUES(...)' };
      }
      if (columns && rows.some(row => row.length !== columns.length)) {
        return { error: 'número de valores não bate com o número de colunas' };
      }

      return { tableName, columns, rows };
    }

    // Pretty-printed, still-valid SQL: one column/value per line for a
    // single row, one compact row per line for multi-row inserts.
    function formatAsSql(parsed) {
      let out = `INSERT INTO ${parsed.tableName}`;

      if (parsed.columns) {
        out += ' (\n' + parsed.columns.map(c => `  ${c}`).join(',\n') + '\n)';
      }

      out += ' VALUES';
      if (parsed.rows.length === 1) {
        out += ' (\n' + parsed.rows[0].map(v => `  ${v}`).join(',\n') + '\n)';
      } else {
        out += '\n' + parsed.rows.map(row => `  (${row.join(', ')})`).join(',\n');
      }

      return out + ';';
    }

    // Debug-style listing: one "coluna: valor" line per value, no longer
    // valid SQL but handy for eyeballing which value maps to which column.
    function formatAsColumnValue(parsed) {
      let out = `INSERT INTO ${parsed.tableName}\n`;
      parsed.rows.forEach((row, rowIndex) => {
        if (parsed.rows.length > 1) out += `-- Linha ${rowIndex + 1}\n`;
        row.forEach((value, i) => {
          const colName = parsed.columns ? parsed.columns[i] : `Coluna ${i + 1}`;
          out += `${colName}: ${value}\n`;
        });
        if (parsed.rows.length > 1) out += '\n';
      });
      return out.trimEnd();
    }

    function formatarSQL() {
      const inputTextArea = document.getElementById('sqlInput');
      const resultTextArea = document.getElementById('resultTextarea');

      const sql = inputTextArea.value.trim();
      if (!sql) {
        resultTextArea.value = '';
        resultTextArea.classList.remove('hasError');
        return;
      }

      const statements = splitStatements(sql);
      if (statements.length === 0) {
        resultTextArea.value = 'Formato SQL inválido - válido: INSERT INTO TABELA (COL1, COL2) VALUES (1, 2)';
        resultTextArea.classList.add('hasError');
        return;
      }

      const format = document.querySelector('input[name="outputFormat"]:checked').value;
      const formatFn = format === 'columnValue' ? formatAsColumnValue : formatAsSql;

      let hasError = false;
      const blocks = statements.map((stmt, i) => {
        const parsed = parseInsertStatement(stmt);
        const label = statements.length > 1 ? `-- Statement ${i + 1}\n` : '';
        if (parsed.error) {
          hasError = true;
          return `${label}-- ERRO: ${parsed.error}\n-- SQL: ${stmt.trim()}`;
        }
        return label + formatFn(parsed);
      });

      resultTextArea.value = blocks.join('\n\n');
      resultTextArea.classList.toggle('hasError', hasError);
    }

    function copiarResultado() {
      const resultTextArea = document.getElementById('resultTextarea');
      const copyButton = document.getElementById('copyButton');
      if (!resultTextArea.value) return;

      navigator.clipboard.writeText(resultTextArea.value).then(() => {
        const original = copyButton.textContent;
        copyButton.textContent = 'Copiado!';
        setTimeout(() => { copyButton.textContent = original; }, 1500);
      });
    }

    function carregarExemplo() {
      const exemplo = `INSERT INTO clientes (id, nome, email, cidade, criado_em) VALUES
  (1, 'Maria Silva', 'maria@email.com', 'São Paulo', NOW()),
  (2, 'João Souza, Jr.', 'joao@email.com', 'Rio de Janeiro', NOW()),
  (3, 'Ana O''Brien', 'ana@email.com', 'Curitiba', NOW());

INSERT INTO pedidos (id, cliente_id, produto, valor, status) VALUES
  (101, 1, 'Notebook', 3499.90, 'pago'),
  (102, 2, 'Mouse sem fio', 89.90, 'pendente'),
  (103, 3, CONCAT('Teclado', ' mecânico'), 249.50, 'pago');`;

      document.getElementById('sqlInput').value = exemplo;
      formatarSQL();
    }

    function limpar() {
      const inputTextArea = document.getElementById('sqlInput');
      const resultTextArea = document.getElementById('resultTextarea');
      inputTextArea.value = '';
      resultTextArea.value = '';
      resultTextArea.classList.remove('hasError');
      inputTextArea.focus();
    }

    let debounceTimer;
    document.getElementById('sqlInput').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(formatarSQL, 400);
    });

    document.querySelectorAll('input[name="outputFormat"]').forEach(radio => {
      radio.addEventListener('change', formatarSQL);
    });

    document.getElementById('sqlInput').focus();
  </script>
</body>
</html>
